<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opção 1 - Destaque Topo + 3 Embaixo</title>
  <link rel="stylesheet" href="opcao1_estilo.css">
</head>
<body>
  <header>
    <h1>Projeto Flexbox - Opção 1</h1>
    <p>1 Bloco em Destaque no Topo + 3 Blocos Menores Abaixo</p>
  </header>

  <main class="container">
    <!-- Bloco Principal / Destaque -->
    <section class="bloco bloco-destaque">
      <h2>Bloco 1 (Destaque Principal)</h2>
      <p>Conteúdo de maior relevância do seu site, ocupando 100% da largura superior.</p>
    </section>

    <!-- Sub-container para os 3 blocos em linha -->
    <div class="linha-inferior">
      <article class="bloco">
        <h3>Bloco 2</h3>
        <p>Conteúdo secundário 1.</p>
      </article>
      <article class="bloco">
        <h3>Bloco 3</h3>
        <p>Conteúdo secundário 2.</p>
      </article>
      <article class="bloco">
        <h3>Bloco 4</h3>
        <p>Conteúdo secundário 3.</p>
      </article>
    </div>
  </main>
</body>
</html>
